
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoVault - Exact Match Car Catalog</title>
  
  <!-- Include HTML5-QRCode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }

    header {
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header h1 { margin: 0; color: var(--accent); font-size: 1.4rem; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    
    .section { display: none; }
    .section.active { display: block; }

    /* Car Grid */
    .car-grid { display: flex; flex-direction: column; gap: 16px; }
    .car-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .car-card img { width: 100%; height: 200px; object-fit: cover; }
    .car-info { padding: 16px; }
    .car-info h3 { margin: 0 0 8px 0; color: var(--accent); }
    .car-info p { margin: 4px 0; color: var(--subtext); font-size: 0.9rem; }
    .car-info strong { color: var(--text); }

    .delete-btn {
      margin-top: 12px;
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    /* Scanner & Upload Container */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      border: 2px solid #334155;
      margin-bottom: 16px;
    }

    .vision-box {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 2px dashed #475569;
      text-align: center;
      margin-top: 20px;
    }
    .vision-box input[type="file"] { display: none; }
    .upload-label {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    /* Forms */
    form { display: flex; flex-direction: column; gap: 12px; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    input, textarea, select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    button.submit-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center; align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--accent);
      text-align: center;
    }
    .modal-content img { width: 100%; border-radius: 8px; height: 180px; object-fit: cover; margin-bottom: 12px; }

    /* Bottom Navigation */
    nav {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #334155;
      z-index: 100;
    }
    nav button {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav button.active { color: var(--accent); font-weight: bold; }
    .loading-status { color: var(--accent); font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">🚗 AutoVault Catalog</h1>
  </header>

  <div class="container">
    
    <!-- CATALOG SECTION -->
    <div id="catalogSection" class="section active">
      <div id="carGrid" class="car-grid"></div>
    </div>

    <!-- SCANNER & UPLOAD SECTION -->
    <div id="scannerSection" class="section">
      <p style="text-align:center; color: var(--subtext);">Scan a QR code or upload any car image from your gallery:</p>
      
      <!-- QR Camera Reader -->
      <div id="reader"></div>

      <!-- Foolproof Selection & Upload Box -->
      <div class="vision-box">
        <h3 style="margin:0 0 5px 0; color:var(--text);">📁 Select Car & Upload</h3>
        <p style="font-size:0.85rem; color:var(--subtext); margin:8px 0 10px 0;">Select the exact car model before uploading to ensure 100% precision:</p>
        
        <select id="exactCarSelector" style="width:100%; margin-bottom:12px;">
          <option value="AUDI_R8">Audi R8 V10 Performance (Gloss Red)</option>
          <option value="MERCEDES_CYAN">Mercedes-AMG GT Black Series (Cyan Light Blue)</option>
          <option value="ROLLS_ROYCE">Rolls-Royce Ghost Black Badge (Midnight Black)</option>
          <option value="BMW_M8">BMW M8 Competition Coupe (Alpine White)</option>
          <option value="MERCEDES_GRAY">Mercedes-AMG GT S (Matte Dark Gray)</option>
          <option value="MERCEDES_YELLOW">Mercedes-AMG GT S (Solarbeam Yellow)</option>
        </select>

        <label class="upload-label">
          Upload Photo & Get Exact Info
          <input type="file" id="carImageInput" accept="image/*" onchange="handleExactUpload(event)">
        </label>
        <div id="aiStatus" class="loading-status">Ready</div>
      </div>
    </div>

    <!-- ADD CAR SECTION -->
    <div id="manageSection" class="section">
      <h2>Add New Car</h2>
      <form id="addCarForm" onsubmit="saveCar(event)">
        <input type="text" id="carIdInput" placeholder="Unique QR Code ID (e.g. BMW_M4)" required>
        <input type="text" id="carName" placeholder="Car Name (e.g. BMW M4 Competition)" required>
        <input type="text" id="carColor" placeholder="Color (e.g. Green)" required>
        <input type="text" id="carHp" placeholder="Horsepower (e.g. 503 hp)" required>
        <input type="text" id="carSpeed" placeholder="Top Speed (e.g. 110 mph)" required>
        <textarea id="carSpecs" placeholder="Description / Specs" rows="3" required></textarea>
        <input type="url" id="carImg" placeholder="Image URL (e.g. Unsplash link)" required>
        <button type="submit" class="submit-btn">Save to Catalog</button>
      </form>
    </div>

  </div>

  <!-- Modal Popup for Car Details -->
  <div id="carModal" class="modal">
    <div class="modal-content">
      <img id="modalImage" src="" alt="Car Image">
      <h2 id="modalTitle" style="color:var(--accent); margin:5px 0;"></h2>
      <p style="text-align:left;"><strong>Color:</strong> <span id="modalColor"></span></p>
      <p style="text-align:left;"><strong>Horsepower:</strong> <span id="modalHp"></span></p>
      <p style="text-align:left;"><strong>Top Speed:</strong> <span id="modalSpeed"></span></p>
      <p style="text-align:left;"><strong>Specs:</strong> <span id="modalSpecs"></span></p>
      <button class="submit-btn" style="width:100%; margin-top:15px;" onclick="closeModal()">Scan Another</button>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav>
    <button onclick="switchTab('catalog')" id="navCatalog" class="active"><span>🚗</span> Catalog</button>
    <button onclick="switchTab('scanner')" id="navScanner"><span>📷</span> Scan / Upload</button>
    <button onclick="switchTab('manage')" id="navManage"><span>➕</span> Add Car</button>
  </nav>

  <script>

    function getAllCars() {
      let savedCars = JSON.parse(localStorage.getItem("all_vault_cars") || "null");
      if (!savedCars || !savedCars["AUDI_R8"] || !savedCars["ROLLS_ROYCE"]) {
        localStorage.setItem("all_vault_cars", JSON.stringify(defaultCars));
