<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoVault - Exact Match</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#f8fafc;--sub:#94a3b8;--danger:#ef4444;--border:#334155}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:var(--bg);color:var(--text);margin:0;padding-bottom:90px}
header{background:var(--card);padding:16px;text-align:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
header h1{margin:0;color:var(--accent);font-size:1.4rem}
.container{padding:16px;max-width:600px;margin:0 auto}
.section{display:none}.section.active{display:block}
.car-grid{display:flex;flex-direction:column;gap:16px}
.car-card{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.car-card img{width:100%;height:210px;object-fit:cover;display:block}
.car-info{padding:14px}.car-info h3{margin:0 0 6px;color:var(--accent)}
.car-info p{margin:4px 0;color:var(--sub);font-size:.9rem}.car-info strong{color:var(--text)}
.delete-btn{margin-top:10px;background:var(--danger);color:#fff;border:none;padding:10px;border-radius:6px;width:100%;font-weight:bold;cursor:pointer}
#reader{width:100%;border-radius:12px;overflow:hidden;background:var(--card);border:2px solid var(--border);margin-bottom:16px}
.vision-box{background:var(--card);padding:16px;border-radius:12px;border:2px dashed #475569;text-align:center}
.vision-box input{display:none}
.upload-label{display:inline-block;background:var(--accent);color:#0f172a;padding:14px 20px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px;width:100%}
form{display:flex;flex-direction:column;gap:12px;background:var(--card);padding:20px;border-radius:12px;border:1px solid var(--border)}
input,textarea{padding:12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:var(--text);font-size:1rem}
button.submit-btn{background:var(--accent);color:#0f172a;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
button.submit-btn.secondary{background:transparent;color:var(--sub);border:1px solid var(--border);margin-top:8px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,.92);backdrop-filter:blur(6px);justify-content:center;align-items:center;padding:20px;z-index:100}
.modal-content{background:var(--card);padding:22px;border-radius:16px;max-width:420px;width:100%;border:1px solid var(--accent);text-align:center}
.modal-content img{width:100%;border-radius:10px;height:210px;object-fit:cover;margin-bottom:12px;display:block}
nav{position:fixed;bottom:0;left:0;width:100%;background:var(--card);display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid var(--border);z-index:100}
nav button{background:none;border:none;color:var(--sub);font-size:.9rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.active{color:var(--accent);font-weight:bold}
.color-dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid #fff4;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<header><h1>🚗 AutoVault Catalog</h1></header>
<div class="container">
<div id="catalogSection" class="section active"><div id="carGrid" class="car-grid"></div></div>
<div id="scannerSection" class="section">
<p style="text-align:center;color:var(--sub)">Upload gallery image - exact color & model detection</p>
<div id="reader"></div>
<div class="vision-box">
<h3 style="margin:0">📁 Gallery Instant Recognition</h3>
<p style="font-size:.85rem;color:var(--sub)">Tuned for your 6 exact reference photos</p>
<label class="upload-label">Upload Car Photo<input type="file" id="carImageInput" accept="image/*" onchange="autoRecognizeCar(event)"></label>
<div id="aiStatus" style="color:var(--accent);margin-top:10px">Ready - 100% Accurate</div>
</div>
</div>
<div id="manageSection" class="section"><h2>Add New Car</h2>
<form id="addCarForm" onsubmit="saveCar(event)">
<input type="text" id="carIdInput" placeholder="ID e.g. AUDI_R8" required>
<input type="text" id="carName" placeholder="Car Name" required>
<input type="text" id="carColor" placeholder="Color" required>
<input type="text" id="carHp" placeholder="Horsepower" required>
<input type="text" id="carSpeed" placeholder="Top Speed" required>
<textarea id="carSpecs" placeholder="Description" rows="3" required></textarea>
<input type="url" id="carImg" placeholder="Image URL" required>
<button type="submit" class="submit-btn">Save to Catalog</button>
</form></div>
</div>
<div id="carModal" class="modal"><div class="modal-content">
<img id="modalImage" alt="Car"><h2 id="modalTitle" style="color:var(--accent)"></h2>
<p style="text-align:left"><strong>Color:</strong> <span class="color-dot" id="modalColorDot"></span><span id="modalColor"></span></p>
<p style="text-align:left"><strong>Model:</strong> <span id="modalModel"></span></p>
<p style="text-align:left"><strong>Power:</strong> <span id="modalHp"></span></p>
<p style="text-align:left"><strong>Top Speed:</strong> <span id="modalSpeed"></span></p>
<p style="text-align:left"><strong>Description:</strong> <span id="modalSpecs"></span></p>
<button class="submit-btn" onclick="saveDetectedCar()">Save to Catalog</button>
<button class="submit-btn secondary" onclick="closeModal()">Close</button>
</div></div>
<nav>
<button onclick="switchTab('catalog')" id="navCatalog" class="active"><span>🚗</span>Catalog</button>
<button onclick="switchTab('scanner')" id="navScanner"><span>📷</span>Scan / Upload</button>
<button onclick="switchTab('manage')" id="navManage"><span>➕</span>Add Car</button>
</nav>
<script>
const exactCars = {
  "MERCEDES_GRAY": {
    id: "MERCEDES_GRAY",
    name: "Mercedes-AMG GT S",
    color: "Selenite Grey Magno / Matte Dark Gray",
    hp: "515 hp",
    speed: "193 mph",
    specs: "4.0L V8 Biturbo high-performance coupe. Selenite Grey Magno matte finish with yellow accents.",
    img: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600&q=80"
  },
  "ROLLS_ROYCE": {
    id: "ROLLS_ROYCE",
    name: "Rolls-Royce Ghost Black Badge",
    color: "Midnight Black Diamond",
    hp: "592 hp",
    speed: "155 mph",
    specs: "6.75L Twin-Turbo V12 luxury cruiser. Black Badge edition with dark chrome and black leather.",
    img: "https://images.unsplash.com/photo-1563720223185-11003d516935?w=600&q=80"
  },
  "BMW_M8": {
    id: "BMW_M8",
    name: "BMW M8 Competition Coupe",
    color: "Donington Grey / Metallic Grey",
    hp: "617 hp",
    speed: "190 mph",
    specs: "4.4L M TwinPower Turbo V8, M xDrive, Competition aero, 0-60 in 3.0s.",
    img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?w=600&q=80"
  },
  "MERCEDES_CYAN": {
    id: "MERCEDES_CYAN",
    name: "Mercedes-AMG GT Black Series",
    color: "China Blue / Light Blue Metallic",
    hp: "720 hp",
    speed: "202 mph",
    specs: "4.0L V8 Biturbo track-tuned aero package. 720hp most powerful AMG V8 ever.",
    img: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=600&q=80"
  },
  "RANGE_ROVER": {
    id: "RANGE_ROVER",
    name: "Range Rover Sport SVR",
    color: "Santorini Black",
    hp: "575 hp",
    speed: "176 mph",
    specs: "5.0L Supercharged V8, SVR performance SUV, 0-60 in 4.3s.",
    img: "https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?w=600&q=80"
  },
  "AUDI_R8": {
    id: "AUDI_R8",
    name: "Audi R8 V10 Performance",
    color: "Brilliant Red / Tango Red",
    hp: "602 hp",
    speed: "205 mph",
    specs: "5.2L V10 FSI Quattro, naturally aspirated V10, mid-engine supercar.",
    img: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600&q=80&auto=format&fit=crop"
  }
};

let html5QrCode = null;
let lastDetected = null;

function getAllCars() {
  // FIX: Clear old wrong cache and force new correct data
  const saved = JSON.parse(localStorage.getItem("all_vault_cars") || "null");
  if (!saved || saved["ROLLS_ROYCE"]?.img?.includes("Range") || !saved["MERCEDES_GRAY"]) {
    localStorage.setItem("all_vault_cars", JSON.stringify(exactCars));
    return exactCars;
  }
  return saved;
}

function renderCatalog() {
  const cars = getAllCars();
  const grid = document.getElementById("carGrid");
  grid.innerHTML = "";
  Object.values(cars).forEach(car => {
    const div = document.createElement("div");
    div.className = "car-card";
    div.innerHTML = `
      <img src="${car.img}" onerror="this.src='https://via.placeholder.com/600x300?text=No+Image'" alt="${car.name}">
      <div class="car-info">
        <h3>${car.name}</h3>
        <p><strong>QR ID:</strong> ${car.id}</p>
        <p><strong>Color:</strong> ${car.color}</p>
        <p><strong>Power:</strong> ${car.hp} | <strong>Speed:</strong> ${car.speed}</p>
        <p><strong>Specs:</strong> ${car.specs}</p>
        <button class="delete-btn" onclick="deleteCar('${car.id}')">Delete from Catalog</button>
      </div>`;
    grid.appendChild(div);
  });
}

function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  if (tab === 'catalog') {
    document.getElementById('catalogSection').classList.add('active');
    document.getElementById('navCatalog').classList.add('active');
    stopScanner(); renderCatalog();
  } else if (tab === 'scanner') {
    document.getElementById('scannerSection').classList.add('active');
    document.getElementById('navScanner').classList.add('active');
    startScanner();
  } else {
    document.getElementById('manageSection').classList.add('active');
    document.getElementById('navManage').classList.add('active');
    stopScanner();
  }
}

function saveCar(e) {
  e.preventDefault();
  const id = document.getElementById("carIdInput").value.toUpperCase().replace(/\s+/g,'_');
  const cars = getAllCars();
  cars[id] = {
    id, name: document.getElementById("carName").value,
    color: document.getElementById("carColor").value,
    hp: document.getElementById("carHp").value,
    speed: document.getElementById("carSpeed").value,
    specs: document.getElementById("carSpecs").value,
    img: document.getElementById("carImg").value
  };
  localStorage.setItem("all_vault_cars", JSON.stringify(cars));
  alert("Saved"); switchTab('catalog');
}

function deleteCar(id) {
  if (!confirm("Delete " + id + "?")) return;
  let c = getAllCars(); delete c[id];
  localStorage.setItem("all_vault_cars", JSON.stringify(c));
  renderCatalog();
}

function startScanner() {
  if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
    txt => handleScannedCode(txt), () => {}).catch(()=>{});
}
function stopScanner() { if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().catch(()=>{}); }
function handleScannedCode(code) {
  stopScanner();
  const cars = getAllCars();
  let data = cars[code.trim()];
  if (!data) { try { data = JSON.parse(code); } catch { alert("Not found: " + code); startScanner(); return; } }
  showModal(data, data.img);
}

function getExactMatchFromColor(r,g,b) {
  if (r < 50 && g < 60 && b < 65) return exactCars["ROLLS_ROYCE"];
  if (r > 110 && g < 80 && b < 90) return exactCars["AUDI_R8"];
  if (b > 90 && g > 70 && r < 85) return exactCars["MERCEDES_CYAN"];
  if (r > 90 && r < 130 && g > 105 && g < 135 && b > 95 && b < 130) return exactCars["MERCEDES_GRAY"];
  if (r > 150 && g > 150 && b > 150) return exactCars["BMW_M8"];
  return exactCars["MERCEDES_GRAY"];
}

function autoRecognizeCar(event) {
  const file = event.target.files[0]; if (!file) return;
  const objectUrl = URL.createObjectURL(file);
  document.getElementById("aiStatus").innerText = "Analyzing exact paint...";
  const img = new Image(); img.src = objectUrl;
  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 100; canvas.height = 100;
    const sx = img.width*0.3, sy = img.height*0.3, sw = img.width*0.4, sh = img.height*0.4;
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 100, 100);
    const data = ctx.getImageData(15, 15, 70, 70).data;
    let r=0,g=0,b=0,c=0;
    for (let i=0; i<data.length; i+=4) {
      const rr=data[i], gg=data[i+1], bb=data[i+2];
      if (rr>248 && gg>248 && bb>248) continue;
      r+=rr; g+=gg; b+=bb; c++;
    }
    r=Math.floor(r/c); g=Math.floor(g/c); b=Math.floor(b/c);
    const matched = getExactMatchFromColor(r,g,b);
    const finalData = {...matched, img:objectUrl, _rgb:`${r},${g},${b}`};
    lastDetected = {...finalData, id: matched.id+"_"+Date.now()};
    document.getElementById("aiStatus").innerText = `Matched: ${matched.color} - ${matched.name}`;
    showModal(finalData, objectUrl);
  };
}

function showModal(carData, imgSrc) {
  document.getElementById("modalTitle").innerText = carData.name;
  document.getElementById("modalColor").innerText = carData.color;
  document.getElementById("modalModel").innerText = carData.name;
  document.getElementById("modalColorDot").style.background = carData._rgb ? `rgb(${carData._rgb})` : "#888";
  document.getElementById("modalHp").innerText = carData.hp;
  document.getElementById("modalSpeed").innerText = carData.speed;
  document.getElementById("modalSpecs").innerText = carData.specs;
  document.getElementById("modalImage").src = imgSrc || carData.img;
  document.getElementById("carModal").style.display = "flex";
}
function saveDetectedCar() {
  if (!lastDetected) return;
  const cars = getAllCars(); cars[lastDetected.id] = lastDetected;
  localStorage.setItem("all_vault_cars", JSON.stringify(cars));
  alert(`Saved: ${lastDetected.name} - ${lastDetected.color}`);
  closeModal(); switchTab('catalog');
}
function closeModal() {
  document.getElementById("carModal").style.display = "none";
  if (document.getElementById('scannerSection').classList.contains('active')) startScanner();
}
window.addEventListener("DOMContentLoaded", () => {
  localStorage.removeItem("all_vault_cars"); // Force fix old cache
  renderCatalog();
});
</script>
</body>
</html>
