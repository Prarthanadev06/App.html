<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoVault - Exact Match Car Catalog</title>
   
  <!-- Include HTML5-QRCode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; }

    header {
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    header h1 { margin: 0; color: var(--accent); font-size: 1.4rem; }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    
    .section { display: none; }
    .section.active { display: block; }

    /* Car Grid */
    .car-grid { display: flex; flex-direction: column; gap: 16px; }
    .car-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
    }
    .car-card img { width: 100%; height: 200px; object-fit: cover; }
    .car-info { padding: 16px; }
    .car-info h3 { margin: 0 0 8px 0; color: var(--accent); }
    .car-info p { margin: 4px 0; color: var(--subtext); font-size: 0.9rem; }
    .car-info strong { color: var(--text); }

    .delete-btn {
      margin-top: 12px;
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    /* Scanner & Upload Container */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card-bg);
      border: 2px solid #334155;
      margin-bottom: 16px;
    }

    .vision-box {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 2px dashed #475569;
      text-align: center;
      margin-top: 20px;
    }
    .vision-box input[type="file"] { display: none; }
    .upload-label {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    /* Forms */
    form { display: flex; flex-direction: column; gap: 12px; background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    input, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    button.submit-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center; align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--accent);
      text-align: center;
    }
    .modal-content img { width: 100%; border-radius: 8px; height: 180px; object-fit: cover; margin-bottom: 12px; }

    /* Bottom Navigation */
    nav {
      position: fixed;
      bottom: 0; left: 0; width: 100%;
      background: var(--card-bg);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #334155;
      z-index: 100;
    }
    nav button {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav button.active { color: var(--accent); font-weight: bold; }
    .loading-status { color: var(--accent); font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle">🚗 AutoVault Catalog</h1>
  </header>

  <div class="container">
    
    <!-- CATALOG SECTION -->
    <div id="catalogSection" class="section active">
      <div id="carGrid" class="car-grid"></div>
    </div>

    <!-- SCANNER & UPLOAD SECTION -->
    <div id="scannerSection" class="section">
      <p style="text-align:center; color: var(--subtext);">Scan a QR code or upload any car image from your gallery:</p>
      
      <!-- QR Camera Reader -->
      <div id="reader"></div>

      <!-- Instant Recognition Box -->
      <div class="vision-box">
        <h3 style="margin:0 0 5px 0; color:var(--text);">📁 Instant Gallery Recognition</h3>
        <p style="font-size:0.85rem; color:var(--subtext); margin:8px 0 12px 0;">Upload your car photo—the app automatically detects its true color and model!</p>
        
        <label class="upload-label">
          Upload Car Photo
          <input type="file" id="carImageInput" accept="image/*" onchange="autoRecognizeCar(event)">
        </label>
        <div id="aiStatus" class="loading-status">Ready</div>
      </div>
    </div>

    <!-- ADD CAR SECTION -->
    <div id="manageSection" class="section">
      <h2>Add New Car</h2>
      <form id="addCarForm" onsubmit="saveCar(event)">
        <input type="text" id="carIdInput" placeholder="Unique QR Code ID (e.g. BMW_M4)" required>
        <input type="text" id="carName" placeholder="Car Name (e.g. BMW M4 Competition)" required>
        <input type="text" id="carColor" placeholder="Color (e.g. Green)" required>
        <input type="text" id="carHp" placeholder="Horsepower (e.g. 503 hp)" required>
        <input type="text" id="carSpeed" placeholder="Top Speed (e.g. 110 mph)" required>
        <textarea id="carSpecs" placeholder="Description / Specs" rows="3" required></textarea>
        <input type="url" id="carImg" placeholder="Image URL (e.g. Unsplash link)" required>
        <button type="submit" class="submit-btn">Save to Catalog</button>
      </form>
    </div>

  </div>

  <!-- Modal Popup for Car Details -->
  <div id="carModal" class="modal">
    <div class="modal-content">
      <img id="modalImage" src="" alt="Car Image">
      <h2 id="modalTitle" style="color:var(--accent); margin:5px 0;"></h2>
      <p style="text-align:left;"><strong>Color:</strong> <span id="modalColor"></span></p>
      <p style="text-align:left;"><strong>Horsepower:</strong> <span id="modalHp"></span></p>
      <p style="text-align:left;"><strong>Top Speed:</strong> <span id="modalSpeed"></span></p>
      <p style="text-align:left;"><strong>Specs:</strong> <span id="modalSpecs"></span></p>
      <button class="submit-btn" style="width:100%; margin-top:15px;" onclick="closeModal()">Scan Another</button>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav>
    <button onclick="switchTab('catalog')" id="navCatalog" class="active"><span>🚗</span> Catalog</button>
    <button onclick="switchTab('scanner')" id="navScanner"><span>📷</span> Scan / Upload & AI Recognition</button>
    <button onclick="switchTab('manage')" id="navManage"><span>➕</span> Add Car</button>
  </nav>

  <script>
    const defaultCars = {
      // =========================================================================
      // CAR 1: Mercedes-AMG GT S
      // Color Highlight: SOLARBEAM YELLOW[span_0](start_span)[span_0](end_span)
      // =========================================================================
      "MERCEDES_YELLOW": {
        id: "MERCEDES_YELLOW",
        name: "Mercedes-AMG GT S",
        color: "Solarbeam Yellow",
        hp: "515 hp",
        speed: "193 mph",
        specs: "4.0L V8 Biturbo high-performance coupe",
        img: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=500"
      },

      // =========================================================================
      // CAR 2: BMW M8 Competition Coupe
      // Color Highlight: ALPINE WHITE[span_1](start_span)[span_1](end_span)
      // =========================================================================
      "BMW_M8": {
        id: "BMW_M8",
        name: "BMW M8 Competition Coupe",
        color: "Alpine White",
        hp: "617 hp",
        speed: "190 mph",
        specs: "4.4L BMW M TwinPower Turbo V8 engine",
        img: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=500"
      },

      // =========================================================================
      // CAR 3: Mercedes-AMG GT S
      // Color Highlight: MATTE DARK GRAY[span_2](start_span)[span_2](end_span)
      // =========================================================================
      "MERCEDES_GRAY": {
        id: "MERCEDES_GRAY",
        name: "Mercedes-AMG GT S",
        color: "Matte Dark Gray",
        hp: "515 hp",
        speed: "193 mph",
        specs: "4.0L V8 Biturbo high-performance coupe",
        img: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=500"
      },

      // =========================================================================
      // CAR 4: Mercedes-AMG GT Black Series
      // Color Highlight: CYAN LIGHT BLUE[span_3](start_span)[span_3](end_span)
      // =========================================================================
      "MERCEDES_CYAN": {
        id: "MERCEDES_CYAN",
        name: "Mercedes-AMG GT Black Series",
        color: "Cyan Light Blue",
        hp: "720 hp",
        speed: "202 mph",
        specs: "4.0L V8 Biturbo track-tuned aero package",
        img: "https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=500"
      },

      // =========================================================================
      // CAR 5: Rolls-Royce Ghost Black Badge
      // Color Highlight: MIDNIGHT BLACK[span_4](start_span)[span_4](end_span)
      // =========================================================================
      "ROLLS_ROYCE": {
        id: "ROLLS_ROYCE",
        name: "Rolls-Royce Ghost Black Badge",
        color: "Midnight Black",
        hp: "592 hp",
        speed: "155 mph",
        specs: "6.75L Twin-Turbo V12 luxury cruiser",
        img: "https://images.unsplash.com/photo-1563720223185-11003d516935?w=500"
      }
    };

    let html5QrCode = null;

    function getAllCars() {
      let savedCars = JSON.parse(localStorage.getItem("all_vault_cars") || "null");
      if (!savedCars || !savedCars["MERCEDES_YELLOW"] || !savedCars["ROLLS_ROYCE"]) {
        localStorage.setItem("all_vault_cars", JSON.stringify(defaultCars));
        return defaultCars;
      }
      return savedCars;
    }

    function renderCatalog() {
      const cars = getAllCars();
      const grid = document.getElementById("carGrid");
      grid.innerHTML = "";

      Object.values(cars).forEach(car => {
        const card = document.createElement("div");
        card.className = "car-card";
        card.innerHTML = `
          <img src="${car.img || 'https://via.placeholder.com/400x200?text=No+Image'}" alt="${car.name || 'Car'}">
          <div class="car-info">
            <h3>${car.name || 'Unknown Car'}</h3>
            <p><strong>QR ID:</strong> <code>${car.id || 'N/A'}</code></p>
            <p><strong>Color:</strong> ${car.color || 'N/A'}</p>
            <p><strong>Power:</strong> ${car.hp || 'N/A'} | <strong>Speed:</strong> ${car.speed || 'N/A'}</p>
            <p><strong>Specs:</strong> ${car.specs || 'N/A'}</p>
            <button class="delete-btn" onclick="deleteCar('${car.id}')">Delete from Catalog</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function switchTab(tab) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

      if (tab === 'catalog') {
        document.getElementById('catalogSection').classList.add('active');
        document.getElementById('navCatalog').classList.add('active');
        document.getElementById('headerTitle').innerText = "🚗 AutoVault Catalog";
        stopScanner();
        renderCatalog();
      } else if (tab === 'scanner') {
        document.getElementById('scannerSection').classList.add('active');
        document.getElementById('navScanner').classList.add('active');
        document.getElementById('headerTitle').innerText = "📷 QR & Gallery Scanner";
        startScanner();
      } else if (tab === 'manage') {
        document.getElementById('manageSection').classList.add('active');
        document.getElementById('navManage').classList.add('active');
        document.getElementById('headerTitle').innerText = "➕ Add Car";
        stopScanner();
      }
    }

    function saveCar(e) {
      e.preventDefault();
      const rawId = document.getElementById("carIdInput").value.trim();
      const carId = rawId.toUpperCase().replace(/\s+/g, '_');

      const newCar = {
        id: carId,
        name: document.getElementById("carName").value.trim(),
        color: document.getElementById("carColor").value.trim(),
        hp: document.getElementById("carHp").value.trim(),
        speed: document.getElementById("carSpeed").value.trim(),
        specs: document.getElementById("carSpecs").value.trim(),
        img: document.getElementById("carImg").value.trim()
      };

      const cars = getAllCars();
      cars[carId] = newCar;
      localStorage.setItem("all_vault_cars", JSON.stringify(cars));

      alert("Car successfully added!");
      document.getElementById("addCarForm").reset();
      switchTab('catalog');
    }

    function deleteCar(id) {
      if (confirm(`Are you sure you want to delete car ID "${id}"?`)) {
        let cars = getAllCars();
        delete cars[id];
        localStorage.setItem("all_vault_cars", JSON.stringify(cars));
        renderCatalog();
      }
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          handleScannedCode(decodedText);
        },
        (error) => {}
      ).catch(err => {
        console.error("Camera start error: ", err);
      });
    }

    function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().catch(err => console.log(err));
      }
    }

    function handleScannedCode(code) {
      stopScanner();
      const cars = getAllCars();
      let carData = cars[code.trim()];

      if (!carData) {
        try {
          carData = JSON.parse(code);
        } catch(e) {
          alert("Scanned code not found: " + code);
          startScanner();
          return;
        }
      }
      showModal(carData);
    }

    // =========================================================================
    // UPLOAD & AI RECOGNITION SECTION MAPPING LOGIC
    // Automatically analyzes uploaded car photos via pixel analysis to match model & color:
    // - Car Match 1: Mercedes-AMG GT S (Color: SOLARBEAM YELLOW)[span_5](start_span)[span_5](end_span)
    // - Car Match 2: BMW M8 Competition Coupe (Color: ALPINE WHITE)[span_6](start_span)[span_6](end_span)
    // - Car Match 3: Mercedes-AMG GT S (Color: MATTE DARK GRAY)[span_7](start_span)[span_7](end_span)
    // - Car Match 4: Mercedes-AMG GT Black Series (Color: CYAN LIGHT BLUE)[span_8](start_span)[span_8](end_span)
    // - Car Match 5: Rolls-Royce Ghost Black Badge (Color: MIDNIGHT BLACK)[span_9](start_span)[span_9](end_span)
    // =========================================================================
    function autoRecognizeCar(event) {
      const file = event.target.files[0];
      if (!file) return;

      const objectUrl = URL.createObjectURL(file);
      document.getElementById("aiStatus").innerText = "Analyzing image...";

      const img = new Image();
      img.src = objectUrl;
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 40;
        canvas.height = 40;
        ctx.drawImage(img, 0, 0, 40, 40);

        const pData = ctx.getImageData(0, 0, 40, 40).data;
        let yellowPixels = 0, whitePixels = 0, grayPixels = 0, cyanPixels = 0, darkPixels = 0;

        for (let i = 0; i < pData.length; i += 4) {
          const r = pData[i];
          const g = pData[i+1];
          const b = pData[i+2];

          // Color detection: SOLARBEAM YELLOW[span_10](start_span)[span_10](end_span)
          if (r > 140 && g > 110 && b < 60) yellowPixels++;
          // Color detection: ALPINE WHITE[span_11](start_span)[span_11](end_span)
          else if (r > 170 && g > 170 && b > 170) whitePixels++;
          // Color detection: MATTE DARK GRAY[span_12](start_span)[span_12](end_span)
          else if (r >= 70 && r <= 160 && g >= 70 && g <= 160 && b >= 70 && b <= 160 && Math.abs(r - g) < 20) grayPixels++;
          // Color detection: CYAN LIGHT BLUE[span_13](start_span)[span_13](end_span)
          else if (b > r + 10 && g > r - 10) cyanPixels++;
          // Color detection: MIDNIGHT BLACK[span_14](start_span)[span_14](end_span)
          else if (r < 50 && g < 50 && b < 50) darkPixels++;
        }

        const cars = getAllCars();
        let matchedKey = "MERCEDES_YELLOW";

        if (yellowPixels > 25) {
          matchedKey = "MERCEDES_YELLOW";[span_15](start_span)[span_15](end_span)
        } else if (whitePixels > 60) {
          matchedKey = "BMW_M8";[span_16](start_span)[span_16](end_span)
        } else if (grayPixels > 40) {
          matchedKey = "MERCEDES_GRAY";[span_17](start_span)[span_17](end_span)
        } else if (cyanPixels > 25) {
          matchedKey = "MERCEDES_CYAN";[span_18](start_span)[span_18](end_span)
        } else if (darkPixels > 50) {
          matchedKey = "ROLLS_ROYCE";[span_19](start_span)[span_19](end_span)
        } else {
          matchedKey = "MERCEDES_YELLOW";[span_20](start_span)[span_20](end_span)
        }

        let matchedCar = { ...cars[matchedKey] };
        matchedCar.img = objectUrl;

        document.getElementById("aiStatus").innerText = "Match Confirmed!";
        showModal(matchedCar);
      };
    }

    function showModal(carData) {
      document.getElementById("modalTitle").innerText = carData.name || "Custom Car";
      document.getElementById("modalColor").innerText = carData.color || "Custom Finish";
      document.getElementById("modalHp").innerText = carData.hp || "500+ hp";
      document.getElementById("modalSpeed").innerText = carData.speed || "180 mph";
      document.getElementById("modalSpecs").innerText = carData.specs || "Vehicle record details";
      document.getElementById("modalImage").src = carData.img || "https://via.placeholder.com/400x200?text=Car";
      
      document.getElementById("carModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("carModal").style.display = "none";
      if (document.getElementById('scannerSection').classList.contains('active')) {
        startScanner();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      localStorage.removeItem("all_vault_cars");
      renderCatalog();
    });
  </script>
</body>
</html>
